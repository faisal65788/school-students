<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة أسماء الطلاب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- الهيدر والإحصائيات -->
        <header class="bg-indigo-700 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">🎓 نظام إدارة أسماء الطلاب</h1>
                <p class="text-indigo-200 text-sm mt-1">منصة تسجيل وحفظ وتصدير بيانات الطلاب</p>
            </div>
            <div class="bg-indigo-800/60 border border-indigo-500/30 px-6 py-3 rounded-xl text-center min-w-[160px]">
                <span class="block text-xs text-indigo-200 font-medium">إجمالي الطلاب</span>
                <span id="studentCount" class="text-3xl font-extrabold text-white">0</span>
            </div>
        </header>

        <!-- نموذج تسجيل طالب جديد -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2 flex items-center gap-2">
                <span>➕</span> تسجيل طالب جديد
            </h2>
            <form id="studentForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">اسم الطالب الكامل</label>
                    <input type="text" id="studentName" required placeholder="مثال: أحمد محمد علي" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">الصف / الفصل</label>
                    <input type="text" id="studentClass" required placeholder="مثال: الثالث ثانوي - أ" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">رقم هاتف ولي الأمر</label>
                    <input type="tel" id="studentPhone" required placeholder="05XXXXXXXX" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none text-sm transition" dir="ltr">
                </div>
                <div class="md:col-span-3 text-left">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition shadow-md w-full md:w-auto text-sm">
                        + إضافة الطالب القائمة
                    </button>
                </div>
            </form>
        </section>

        <!-- عرض إدارة وتصدير الكشوفات -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span>📋</span> قائمة الطلاب المسجلين
                </h2>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- البحث الفوري -->
                    <div class="relative w-full md:w-64">
                        <input type="text" id="searchBar" onkeyup="filterStudents()" placeholder="بحث باسم الطالب أو الصف..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none">
                    </div>
                    <!-- زر التصدير CSV/Excel -->
                    <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm transition flex items-center gap-1">
                        <span>📥</span> تصدير Excel (CSV)
                    </button>
                </div>
            </div>

            <!-- جدول البيانات -->
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-right border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                            <th class="p-3 w-12 text-center">#</th>
                            <th class="p-3">اسم الطالب</th>
                            <th class="p-3">الصف / الفصل</th>
                            <th class="p-3">رقم هاتف التواصل</th>
                            <th class="p-3 text-center w-24">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-slate-100 text-slate-700">
                        <!-- تُضاف الصفوف هنا ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- الإشعارات والرسائل التفاعلية -->
    <div id="toast" class="fixed bottom-5 left-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300"></div>

    <script>
        // مصفوفة البيانات الرئيسية للحفظ في localStorage
        let students = JSON.parse(localStorage.getItem('school_students_db')) || [];

        const studentForm = document.getElementById('studentForm');
        const studentTableBody = document.getElementById('studentTableBody');
        const studentCount = document.getElementById('studentCount');
        const toast = document.getElementById('toast');

        // إظهار رسائل تنبيه سريعة البديلة عن Alert
        function showNotification(msg) {
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // عرض قائمة الطلاب في الجدول
        function renderStudents(list = students) {
            studentTableBody.innerHTML = '';
            studentCount.textContent = students.length;

            if (list.length === 0) {
                studentTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center p-8 text-slate-400 font-medium">
                            لا يوجد طلاب مسجلون حتى الآن. قم بملء النموذج للأعلى لإضافة طالب جديد.
                        </td>
                    </tr>`;
                return;
            }

            list.forEach((student, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-indigo-50/50 transition';
                row.innerHTML = `
                    <td class="p-3 text-center font-bold text-slate-400">${index + 1}</td>
                    <td class="p-3 font-semibold text-slate-800">${student.name}</td>
                    <td class="p-3"><span class="bg-indigo-50 border border-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md text-xs font-semibold">${student.class}</span></td>
                    <td class="p-3 text-slate-600 font-mono text-left" dir="ltr">${student.phone}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteStudent(${student.id})" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-50 hover:bg-red-100 border border-red-200 px-2.5 py-1 rounded-lg transition">
                            حذف
                        </button>
                    </td>
                `;
                studentTableBody.appendChild(row);
            });
        }

        // إضافة طالب جديد
        studentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const studentClass = document.getElementById('studentClass').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();

            const newStudent = {
                id: Date.now(),
                name: name,
                class: studentClass,
                phone: phone
            };

            students.push(newStudent);
            saveAndRefresh();
            studentForm.reset();
            showNotification(`تم إدراج الطالب (${name}) بنجاح!`);
        });

        // حذف طالب
        function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            saveAndRefresh();
            showNotification('تم حذف بيانات الطالب من القائمة.');
        }

        // حفظ في LocalStorage وتحديث الواجهة
        function saveAndRefresh() {
            localStorage.setItem('school_students_db', JSON.stringify(students));
            filterStudents();
        }

        // البحث الفوري
        function filterStudents() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();
            const filtered = students.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.class.toLowerCase().includes(query)
            );
            renderStudents(filtered);
        }

        // تصدير إلى Excel/CSV يدعم اللغة العربية UTF-8 BOM
        function exportCSV() {
            if (students.length === 0) {
                showNotification('لا توجد بيانات طلاب للتصدير!');
                return;
            }

            // إدراج BOM لتدعم برامج مثل Excel الكلمات العربية بشكل صحيح
            let csvContent = "\uFEFFالرقم التسلسلي,اسم الطالب الكامل,الصف/الفصل,رقم هاتف ولي الأمر\n";
            students.forEach((s, idx) => {
                csvContent += `${idx + 1},"${s.name}","${s.class}","${s.phone}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `كشف_طلاب_المدرسة_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showNotification('تم تنزيل كشف البيانات بنجاح.');
        }

        // التشغيل المبدئي
        renderStudents();
    </script>
</body>
</html>
